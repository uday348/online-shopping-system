
spring.application.name=API-GATEWAY
server.port=${PORT:8002}

# Disable Eureka completely
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.service-registry.auto-registration.enabled=false

# Disable service discovery locator
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=https://user-service-ubrn.onrender.com
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# Product Service
spring.cloud.gateway.server.webflux.routes[1].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=https://product-service-ubrn.onrender.com
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products/**

# Order Service
spring.cloud.gateway.server.webflux.routes[2].id=ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=https://order-service-ubrn.onrender.com
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=https://notification-service-ubrn.onrender.com
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notifications/**

# Management
management.endpoints.web.exposure.include=health,info
