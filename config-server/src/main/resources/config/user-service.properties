spring.application.name=USER-SERVICE

server.port=${PORT:8003}

# Eureka
eureka.client.service-url.defaultZone=https://eureka-server-92rv.onrender.com/eureka/

eureka.instance.hostname=user-service-ubrn.onrender.com
eureka.instance.prefer-ip-address=false

eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443

eureka.instance.home-page-url=https://user-service-ubrn.onrender.com/
eureka.instance.status-page-url=https://user-service-ubrn.onrender.com/actuator/info
eureka.instance.health-check-url=https://user-service-ubrn.onrender.com/actuator/health

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=*